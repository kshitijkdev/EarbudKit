pluginManagement {
  def fixPath = { p ->
    if (p == null) return p
    def pathStr = p.toString()
    def rootDrive = rootDir.absolutePath.substring(0, 2)
    if (!pathStr.startsWith(rootDrive)) {
      def idx = pathStr.indexOf("EarbudKit")
      if (idx != -1) {
        def relPath = pathStr.substring(idx + "EarbudKit".length())
        return new File(rootDir.parentFile, relPath).absolutePath
      }
    }
    return pathStr
  }

  def reactNativeGradlePlugin = fixPath(new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath)
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = fixPath(new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath)
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'EarbudKit'

expoAutolinking.useExpoVersionCatalog()

include ':app'

def fixPath = { p ->
  if (p == null) return p
  def pathStr = (p instanceof File) ? ((File) p).absolutePath : p.toString()
  def rootDrive = rootDir.absolutePath.substring(0, 2)
  if (!pathStr.startsWith(rootDrive)) {
    def idx = pathStr.indexOf("EarbudKit")
    if (idx != -1) {
      def relPath = pathStr.substring(idx + "EarbudKit".length())
      return (p instanceof File) ? new File(rootDir.parentFile, relPath) : new File(rootDir.parentFile, relPath).absolutePath
    }
  }
  return p
}

def rnGradlePlugin = fixPath(expoAutolinking.reactNativeGradlePlugin)
includeBuild(rnGradlePlugin)

rootProject.children.each { child ->
  def path = child.projectDir.absolutePath
  def rootDrive = rootDir.absolutePath.substring(0, 2)
  if (!path.startsWith(rootDrive)) {
    def idx = path.indexOf("EarbudKit")
    if (idx != -1) {
      def relPath = path.substring(idx + "EarbudKit".length())
      child.projectDir = new File(rootDir.parentFile, relPath)
    }
  }
}
